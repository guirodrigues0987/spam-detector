services:
  api:
    build: .
    image: spam-detector:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SPAM_THRESHOLD: ${SPAM_THRESHOLD:-0.5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Monitoring stack: start it with `docker compose --profile monitoring up --build`.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    profiles: [monitoring]
    image: grafana/grafana-oss:12.4.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Local demo only (port bound to 127.0.0.1). Set GRAFANA_ADMIN_PASSWORD in .env to change it.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
  grafana-data:
